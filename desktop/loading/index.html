<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ultimate Tester</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #f7f7f7; color: #5f5f63; -webkit-user-select: none; user-select: none; cursor: default; font: 14px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { body { background: #1e1e20; color: #a1a1a6; } }
  .dot { width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 14px; background: radial-gradient(circle at 35% 30%, #e4f0d8, #7fa785 55%, #3f6b4b); display: grid; place-items: center; color: transparent; }
</style>
</head>
<body>
  <div><div class="dot">T</div><p id="msg"></p></div>
  <script>
    // The engine is a local Node server the app starts; open it as soon as it answers.
    // Opens the engine only once the app has confirmed it is Ultimate Tester's own (not just anything on port 4600).
    (async function wait(tries = 0) {
      let status = 'starting';
      try { status = await window.__TAURI__.core.invoke('engine_status'); } catch {}
      if (status === 'ours') { location.replace('http://localhost:4600/' + location.search); return; }
      const msg = document.getElementById('msg');
      // Quiet for the usual second or two; words only if it is slow, then a way forward if it never comes.
      if (status === 'other' && tries >= 6) msg.innerHTML = 'Another program is using port 4600, so Tess can\u2019t start.<br>Quit it, then open Ultimate Tester again.';
      else if (tries === 6) msg.textContent = 'Starting Tess\u2026';
      else if (tries === 60) msg.innerHTML = 'Tess is taking too long to start.<br>Check that Node.js 20 or newer is installed (nodejs.org), then open Ultimate Tester again.';
      setTimeout(() => wait(tries + 1), 500);
    })();
  </script>
</body>
</html>
